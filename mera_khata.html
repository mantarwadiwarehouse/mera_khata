<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#1f6f55">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mera Khata</title>
<style>
:root{--bg:#eef2ee;--sf:#fff;--ink:#1b2a24;--mut:#5d6f66;--ac:#1f6f55;--acs:#dcebe3;--out:#b3402f;--in:#1f7a4f;--owe:#a07015;--ln:#d5ddd7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--sf:#1a2420;--ink:#e6efe9;--mut:#93a59b;--ac:#5cc9a0;--acs:#22332c;--out:#e8806e;--in:#5cc9a0;--owe:#e0b155;--ln:#2a3832}}
:root[data-theme="dark"]{--bg:#121a16;--sf:#1a2420;--ink:#e6efe9;--mut:#93a59b;--ac:#5cc9a0;--acs:#22332c;--out:#e8806e;--in:#5cc9a0;--owe:#e0b155;--ln:#2a3832}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:760px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:20px;margin:6px 0 10px}
h2{font-size:16px;margin:18px 0 8px}
nav{display:flex;gap:4px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
nav button{flex:1}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:transparent;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--mut)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
nav button.on,.seg button.on{background:var(--ac);color:var(--bg);font-weight:600}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.k{color:var(--mut);font-size:12.5px}
.v{font-size:20px;font-weight:700}
.out{color:var(--out)}.in{color:var(--in)}.owe{color:var(--owe)}
.big{font-size:30px;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 130px}
label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--ln);border-radius:7px;background:var(--bg)}
.add{width:100%;background:var(--ac);color:var(--bg);font-weight:700;padding:11px;margin-top:10px}
.ghost{border:1px solid var(--ln);color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:8px;overflow-x:auto}
.bar{flex:1 0 14px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:14px}
.bar i{display:block;width:100%;background:var(--out);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.bar.t i{opacity:1;outline:2px solid var(--ac)}
.lb{display:flex;gap:3px;overflow-x:auto;font-size:10.5px;color:var(--mut);text-align:center}
.lb span{flex:1 0 14px;min-width:14px}
.cat{display:grid;grid-template-columns:96px 1fr 76px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.cat div b{display:block;height:9px;background:var(--out);border-radius:5px;opacity:.8}
.cat span:last-child{text-align:right}
.item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}
.item:last-child{border:0}
.item small{color:var(--mut);display:block}
.item .r{text-align:right;white-space:nowrap}
.x{padding:2px 8px;font-size:13px}
.seg{display:flex;gap:4px;margin-top:6px}
.seg button{flex:1;border:1px solid var(--ln)}
.pn{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.pn b{font-size:15px}
.empty{color:var(--mut);padding:14px 0;text-align:center}
textarea{min-height:90px;font:12px monospace}
.hide{display:none}
main{padding-bottom:96px}
input,select,textarea{font-size:16px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;height:54px;padding:0 22px;border-radius:27px;background:var(--ac);color:var(--bg);font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#sheet{position:fixed;inset:0;z-index:10}
.bk{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.pan{position:absolute;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;max-height:calc(100% - env(safe-area-inset-top,0px) - 16px);overflow-y:auto;background:var(--sf);border-radius:16px 16px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.pan{animation:none}}
.sh-h{display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.chips button{border:1px solid var(--ln);padding:9px 12px;min-height:40px}
.chips button.on{background:var(--ac);color:var(--bg);font-weight:600;border-color:var(--ac)}
.pan label{margin-top:10px}
.pan input,.pan .add,.pan .ghost{min-height:46px}
.pan .amt{font-size:26px;font-weight:700}
/* app-style mobile layout */
main{max-width:480px;padding:0 14px 150px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 8px}
.top h1{margin:0;font-size:22px}
nav{position:fixed;top:auto;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;gap:0;border:0;border-top:1px solid var(--ln);border-radius:16px 16px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:4}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;padding:6px 0;background:transparent}
nav button span{font-size:21px;line-height:1}
nav button.on{background:transparent;color:var(--ac);font-weight:700}
.fab{width:58px;height:58px;padding:0;font-size:30px;line-height:1;bottom:calc(78px + env(safe-area-inset-bottom,0px));right:max(16px,calc(50% - 224px))}
.pan{max-width:480px}
.hero{background:var(--ac);color:var(--bg);border:0}
.hero .k{color:var(--bg);opacity:.85}
.hero .big{color:var(--bg)}
.card{border-radius:14px}
</style>
</head>
<body>
<main>
<div class="top"><h1>Mera Khata</h1><small id="dt" class="k"></small></div>
<nav id="nav">
 <button data-t="home" class="on"><span>🏠</span>Home</button>
 <button data-t="list"><span>🧾</span>Entries</button>
 <button data-t="udh"><span>🤝</span>Udhaar</button>
 <button data-t="rep"><span>📊</span>Report</button>
</nav>
<section id="v"></section>
<button class="fab" id="fab" aria-label="Nayi entry">+</button>
<div id="sheet" class="hide"></div>
<datalist id="cats"></datalist>
<datalist id="ppl"></datalist>
</main>
<script>
const KEY='khata-v1';
let E=[];try{E=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){E=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(E))}catch(e){}};
const T={exp:['Kharcha',-1],inc:['Aamdani',1],wk:['Weekly payment mila',1],bor:['Udhaar liya',1],len:['Udhaar diya',-1],rpo:['Udhaar chukaya',-1],rpi:['Udhaar wapas mila',1]};
const CATS=['Khana','Travel','Petrol','Recharge','Ghar','Kiraya','Saman','Medical','Other'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n<0?'-':'')+'₹'+(+Math.abs(n).toFixed(2)).toLocaleString('en-IN');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const wkS=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);x.setHours(0,0,0,0);return x};
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dl=d=>d.getDate()+' '+MO[d.getMonth()];
const sum=(l,ty)=>l.filter(e=>ty.includes(e.type)).reduce((a,e)=>a+e.amt,0);
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
let tab='home',rm='week',ro=0,armed=null,draft={type:'exp'};

function between(a,b){const x=iso(a),y=iso(b);return E.filter(e=>e.date>=x&&e.date<=y)}
function bars(series,todayLabel){
 const mx=Math.max(1,...series.map(s=>s.v));
 return '<div class="bars">'+series.map(s=>'<div class="bar'+(s.t?' t':'')+'" title="'+esc(s.l)+': '+fmt(s.v)+'"><i style="height:'+(s.v/mx*100)+'%"></i></div>').join('')+'</div><div class="lb">'+series.map(s=>'<span>'+esc(s.s)+'</span>').join('')+'</div>';
}
function cats(l){
 const m={};l.filter(e=>e.type==='exp').forEach(e=>{const c=e.cat||'Other';m[c]=(m[c]||0)+e.amt});
 const a=Object.entries(m).sort((x,y)=>y[1]-x[1]);if(!a.length)return '<div class="empty">Is period me koi kharcha nahi</div>';
 const mx=a[0][1];return a.map(([c,v])=>'<div class="cat"><span>'+esc(c)+'</span><div><b style="width:'+(v/mx*100)+'%"></b></div><span>'+fmt(v)+'</span></div>').join('');
}
function balances(){
 const m={};E.forEach(e=>{if(!e.person)return;const p=e.person.trim();m[p]=m[p]||0;
  if(e.type==='bor')m[p]-=e.amt;if(e.type==='rpo')m[p]+=e.amt;if(e.type==='len')m[p]+=e.amt;if(e.type==='rpi')m[p]-=e.amt});
 return m; // positive: unhe dena/milna hai (wo mujhe dene wale), negative: mujhe dena hai
}
function home(){
 const t=today(),s=wkS(t),e=addD(s,6),L=between(s,e);
 const wk=sum(L,['wk']),oi=sum(L,['inc']),sp=sum(L,['exp']);
 const el=Math.round((t-s)/864e5)+1,left=wk+oi-sp,rem=7-el+1;
 const ser=[...Array(7)].map((_,i)=>{const d=addD(s,i);return{l:dl(d),s:'SMTWTFS'[(d.getDay())],v:sum(L.filter(x=>x.date===iso(d)),['exp']),t:iso(d)===iso(t)}});
 const bl=balances();let owe=0,get=0;Object.values(bl).forEach(v=>{if(v<0)owe-=v;else get+=v});
 const cash=E.reduce((a,x)=>a+T[x.type][1]*x.amt,0);
 return '<div class="card hero"><div class="k">Is hafte ('+dl(s)+' – '+dl(e)+') me bacha hua</div><div class="big '+(left<0?'out':'in')+'">'+fmt(left)+'</div>'
 +'<div class="k">Weekly payment + aamdani − kharcha'+(left>0&&rem>0?' · roz ka limit ~ '+fmt(left/rem):'')+'</div></div>'
 +'<div class="grid" style="margin-top:10px">'
 +'<div class="card" style="margin:0"><div class="k">Weekly payment mila</div><div class="v in">'+fmt(wk)+'</div></div>'
 +'<div class="card" style="margin:0"><div class="k">Aaj ka kharcha</div><div class="v out">'+fmt(sum(L.filter(x=>x.date===iso(t)),['exp']))+'</div></div>'
 +'<div class="card" style="margin:0"><div class="k">Hafte ka kharcha</div><div class="v out">'+fmt(sp)+'</div></div>'
 +'<div class="card" style="margin:0"><div class="k">Roz ka average</div><div class="v">'+fmt(sp/el)+'</div></div>'
 +'<div class="card" style="margin:0"><div class="k">Mujhe dena hai</div><div class="v owe">'+fmt(owe)+'</div></div>'
 +'<div class="card" style="margin:0"><div class="k">Mujhe milna hai</div><div class="v in">'+fmt(get)+'</div></div></div>'
 +'<div class="card"><div class="k">Roz ka kharcha (is hafte)</div>'+bars(ser)+'</div>'
 +'<div class="card"><div class="k">Overall paisa haath me (cash + udhaar flow)</div><div class="v">'+fmt(cash)+'</div></div>';
}
function grab(){['amt','person','cat','note','date'].forEach(k=>{const el=document.getElementById('f-'+k);if(el)draft[k]=el.value})}
function form(){
 const d=draft,u=['bor','len','rpo','rpi'].includes(d.type),v=k=>esc(d[k]||'');
 return '<div class="sh-h"><b style="font-size:18px">Nayi entry</b><button class="ghost" id="sh-x" aria-label="Band karo">✕</button></div>'
 +'<div class="chips">'+Object.entries(T).map(([k,x])=>'<button data-ty="'+k+'" class="'+(k===d.type?'on':'')+'">'+x[0]+'</button>').join('')+'</div>'
 +'<label>Amount (₹)</label><input id="f-amt" class="amt" type="number" inputmode="decimal" min="0" step="any" placeholder="0" value="'+v('amt')+'">'
 +(u?'<label>Kiska / kisse</label><input id="f-person" list="ppl" placeholder="Naam" value="'+v('person')+'">':'')
 +(d.type==='exp'||d.type==='inc'?'<label>Category</label><input id="f-cat" list="cats" placeholder="'+(d.type==='exp'?'Khana, Travel...':'Kaam / source')+'" value="'+v('cat')+'">':'')
 +'<label>Tareekh</label><input id="f-date" type="date" value="'+(d.date||iso(new Date()))+'">'
 +'<label>Note (optional)</label><input id="f-note" placeholder="Kuch likhna ho to" value="'+v('note')+'">'
 +'<div id="err" class="k out" style="margin-top:8px"></div><button class="add" id="f-add">Entry save karo</button>';
}
function openSheet(focus){const s=document.getElementById('sheet');s.innerHTML='<div class="bk" id="sh-bk"></div><div class="pan">'+form()+'</div>';s.classList.remove('hide');document.body.style.overflow='hidden';if(focus){const a=document.getElementById('f-amt');if(a)a.focus()}}
function closeSheet(){const s=document.getElementById('sheet');s.classList.add('hide');s.innerHTML='';document.body.style.overflow=''}
function list(){
 const a=[...E].sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id);
 let h='<h2>Saari entries ('+a.length+')</h2><div class="card">';
 if(!a.length)h+='<div class="empty">Abhi koi entry nahi. Home par se pehli entry daalo.</div>';
 let last='';
 a.forEach(e=>{if(e.date!==last){last=e.date;h+='<div class="k" style="margin-top:8px">'+dl(pd(e.date))+' '+pd(e.date).getFullYear()+'</div>'}
  const dir=T[e.type][1];
  h+='<div class="item"><div>'+esc(T[e.type][0])+(e.person?' · '+esc(e.person):'')+'<small>'+esc([e.cat,e.note].filter(Boolean).join(' · '))+'</small></div><div class="r"><b class="'+(dir>0?'in':'out')+'">'+(dir>0?'+':'−')+fmt(e.amt)+'</b><br><button class="x ghost" data-del="'+e.id+'">'+(armed===e.id?'Pakka hatao?':'Hatao')+'</button></div></div>'});
 h+='</div><h2>Backup</h2><div class="card"><div class="k">Data sirf is browser me save hai. Backup text copy karke kahin rakh lo.</div><div class="row" style="margin-top:8px"><button class="ghost" id="b-exp">Backup text banao</button><button class="ghost" id="b-imp">Backup se wapas lao</button></div><textarea id="b-ta" style="margin-top:8px" placeholder="Yaha backup text aayega ya paste karo"></textarea><div id="b-msg" class="k"></div></div>';
 return h;
}
function udh(){
 const b=balances(),ent=Object.entries(b).filter(([,v])=>Math.abs(v)>0.004).sort((x,y)=>y[1]-x[1]);
 const owe=ent.filter(([,v])=>v<0),get=ent.filter(([,v])=>v>0);
 const blk=(t,a,c,w)=>'<div class="card"><div class="k">'+t+'</div><div class="v '+c+'">'+fmt(a.reduce((s,[,v])=>s+Math.abs(v),0))+'</div>'+(a.length?a.map(([p,v])=>'<div class="item"><span>'+esc(p)+'</span><b class="'+c+'">'+fmt(Math.abs(v))+'</b></div>').join(''):'<div class="empty">'+w+'</div>')+'</div>';
 const hist=E.filter(e=>e.person).sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id).slice(0,30);
 return '<h2>Udhaar</h2>'+blk('Mujhe dena hai (maine liya)',owe,'owe','Kisi ka udhaar baaki nahi')+blk('Mujhe milna hai (maine diya)',get,'in','Kisi se paisa lena baaki nahi')
 +'<h2>Udhaar ki history</h2><div class="card">'+(hist.length?hist.map(e=>'<div class="item"><div>'+esc(e.person)+' · '+T[e.type][0]+'<small>'+dl(pd(e.date))+(e.note?' · '+esc(e.note):'')+'</small></div><b>'+fmt(e.amt)+'</b></div>').join(''):'<div class="empty">Koi udhaar entry nahi</div>')+'</div>';
}
function rep(){
 let s,e,title,L,ser=[];const t=today();
 if(rm==='week'){s=addD(wkS(t),7*ro);e=addD(s,6);title=dl(s)+' – '+dl(e)+' '+e.getFullYear();L=between(s,e);
  ser=[...Array(7)].map((_,i)=>{const d=addD(s,i);return{l:dl(d),s:'SMTWTFS'[d.getDay()],v:sum(L.filter(x=>x.date===iso(d)),['exp'])}})}
 else if(rm==='month'){s=new Date(t.getFullYear(),t.getMonth()+ro,1);e=new Date(s.getFullYear(),s.getMonth()+1,0);title=MO[s.getMonth()]+' '+s.getFullYear();L=between(s,e);
  ser=[...Array(e.getDate())].map((_,i)=>{const d=addD(s,i);return{l:dl(d),s:String(i+1),v:sum(L.filter(x=>x.date===iso(d)),['exp'])}})}
 else{L=E;title='Shuru se ab tak';const m={};E.forEach(x=>{const k=x.date.slice(0,7);if(x.type==='exp')m[k]=(m[k]||0)+x.amt});
  ser=Object.keys(m).sort().map(k=>({l:k,s:MO[+k.slice(5)-1],v:m[k]}));
  if(E.length){const ds=E.map(x=>x.date).sort();s=pd(ds[0]);e=pd(ds[ds.length-1])}else{s=e=t}}
 const days=Math.round((e-s)/864e5)+1,wk=sum(L,['wk']),oi=sum(L,['inc']),sp=sum(L,['exp']);
 const c=(k,v,cl)=>'<div class="card" style="margin:0"><div class="k">'+k+'</div><div class="v '+(cl||'')+'">'+fmt(v)+'</div></div>';
 return '<h2>Report</h2><div class="seg">'+[['week','Weekly'],['month','Monthly'],['all','Overall']].map(([k,l])=>'<button data-rm="'+k+'" class="'+(rm===k?'on':'')+'">'+l+'</button>').join('')+'</div>'
 +'<div class="pn">'+(rm==='all'?'<span></span>':'<button class="ghost" data-pn="-1">‹ Pichla</button>')+'<b>'+title+'</b>'+(rm==='all'?'<span></span>':'<button class="ghost" data-pn="1">Agla ›</button>')+'</div>'
 +'<div class="grid" style="margin-top:10px">'+c('Weekly payment mila',wk,'in')+c('Dusri aamdani',oi,'in')+c('Kharcha',sp,'out')+c('Bachat (aamdani − kharcha)',wk+oi-sp,wk+oi-sp<0?'out':'in')+c('Roz ka average kharcha',sp/days)+'</div>'
 +'<div class="card"><div class="k">'+(rm==='all'?'Mahine wise kharcha':'Din wise kharcha')+'</div>'+(ser.length?bars(ser):'<div class="empty">Koi data nahi</div>')+'</div>'
 +'<h2>Kharcha category wise</h2><div class="card">'+cats(L)+'</div>'
 +'<h2>Udhaar (is period me)</h2><div class="grid">'+c('Udhaar liya',sum(L,['bor']),'owe')+c('Udhaar chukaya',sum(L,['rpo']))+c('Udhaar diya',sum(L,['len']),'owe')+c('Wapas mila',sum(L,['rpi']),'in')+'</div>';
}
function render(){
 const f={home,list,udh,rep}[tab];
 document.getElementById('v').innerHTML=f();
 document.getElementById('dt').textContent=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 document.getElementById('cats').innerHTML=[...new Set([...CATS,...E.map(x=>x.cat).filter(Boolean)])].map(c=>'<option value="'+esc(c)+'">').join('');
 document.getElementById('ppl').innerHTML=[...new Set(E.map(x=>x.person).filter(Boolean))].map(c=>'<option value="'+esc(c)+'">').join('');
}
document.addEventListener('click',ev=>{
 if(ev.target.id==='sh-bk'){closeSheet();return}
 const b=ev.target.closest('button');if(!b)return;
 if(b.id==='fab'){openSheet(true);return}
 if(b.id==='sh-x'){closeSheet();return}
 if(b.dataset.ty){grab();draft.type=b.dataset.ty;openSheet(false);return}
 if(b.dataset.t){tab=b.dataset.t;armed=null;render();window.scrollTo(0,0);return}
 if(b.dataset.rm){rm=b.dataset.rm;ro=0;render();return}
 if(b.dataset.pn){ro+=+b.dataset.pn;render();return}
 if(b.dataset.del){const id=+b.dataset.del;if(armed===id){E=E.filter(x=>x.id!==id);armed=null;save()}else armed=id;render();return}
 if(b.id==='f-add'){
  const g=i=>{const el=document.getElementById(i);return el?el.value.trim():''};
  const amt=parseFloat(g('f-amt')),type=draft.type,date=g('f-date'),person=g('f-person');
  const err=document.getElementById('err');
  if(!(amt>0)){err.textContent='Amount sahi daalo.';return}
  if(!date){err.textContent='Tareekh chuno.';return}
  if(['bor','len','rpo','rpi'].includes(type)&&!person){err.textContent='Naam likho: kisse liya ya kisko diya.';return}
  E.push({id:Date.now(),date,type,amt,person:person||'',cat:type==='wk'?'Weekly payment':g('f-cat'),note:g('f-note')});
  draft={type,date};save();closeSheet();render();return}
 if(b.id==='b-exp'){document.getElementById('b-ta').value=JSON.stringify(E);document.getElementById('b-msg').textContent='Ye text copy karke safe jagah rakh lo.';return}
 if(b.id==='b-imp'){try{const a=JSON.parse(document.getElementById('b-ta').value);if(!Array.isArray(a))throw 0;E=a.filter(x=>x&&T[x.type]&&x.amt>0&&x.date);save();render()}catch(e){document.getElementById('b-msg').textContent='Backup text sahi nahi hai.'}return}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet()});
render();
</script>
